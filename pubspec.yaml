name: sankar_group
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

# ---------------------------------------------------------------------------
# Dependencies
# ---------------------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter

  # -- UI / assets -----------------------------------------------------------
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: 3.4.1

  # -- State management --------------------------------------------------------
  flutter_riverpod: ^3.4.3

  # -- Firebase ---------------------------------------------------------------
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0

  # -- Calling / signaling (Zego) ----------------------------------------------
  zego_uikit: ^2.29.2
  zego_uikit_prebuilt_call: ^4.24.4
  zego_uikit_signaling_plugin: ^2.8.21
  # Pinned explicitly: we use ZegoStreamQualityLevel, which zego_uikit doesn't re-export.
  zego_express_engine: 3.25.0

  # -- Platform / utilities -----------------------------------------------------
  permission_handler: 12.0.1
  connectivity_plus: ^6.1.5
  shared_preferences: ^2.5.3
  intl: ^0.20.3

# ---------------------------------------------------------------------------
# Dev dependencies
# ---------------------------------------------------------------------------
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# ---------------------------------------------------------------------------
# Launcher icon config
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_flat_white.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"
  min_sdk_android: 21

# ---------------------------------------------------------------------------
# Flutter config
# ---------------------------------------------------------------------------
flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/sankar_mark.png
